schema: spec-driven

# Project context
context: |
  Tech stack: Node.js (v22), TypeScript (v5.9), Express.js (v5), Firebase Admin SDK & Firestore
  Testing & Tools: Jest, Supertest, ts-jest, Prettier
  Validation & Logging: Joi schemas, Winston logger
  Architecture: Express route-service pattern, scope collections by site (e.g., /:site/:collection), background tasks via node-cron in schedules/
  Domain: Building Management Ecosystem (BME) — core backend for multi-site building operations, resident services, orders, parking, transport, and events.
  Reference: Detailed project context and conventions are in openspec/project.md

